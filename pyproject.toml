[project]
name = "moneta"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1",
    "django>=6.1,<6.2",
    "django-environ>=0.14",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --no-migrations"
# APIs depreciadas quebram a suíte: a atualização de versão do Django fica previsível.
filterwarnings = [
    "error::DeprecationWarning:django.*",
    "error::PendingDeprecationWarning:django.*",
    "error::django.utils.deprecation.RemovedInNextVersionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"
