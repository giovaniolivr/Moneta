{% load static %}<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>{% block title %}{% endblock %} · Moneta</title>
    {# Aplica tema e estado do menu salvos antes da primeira pintura (evita "piscar"). #}
    <script nonce="{{ csp_nonce }}">
      (() => {
        try {
          let t = localStorage.getItem("moneta-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
          if (localStorage.getItem("moneta-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch {}
      })();
    </script>
    <link rel="preload" href="{% static 'fonts/inter-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/ui.js' %}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
